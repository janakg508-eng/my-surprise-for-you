<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Rojina 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;font-family:'Poppins',system-ui,sans-serif;color:#fff;background:#12061f}
.blob{position:fixed;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);opacity:.75;animation:fl 16s ease-in-out infinite alternate}
.b1{background:#ff3d8b;top:-25%;left:-20%}
.b2{background:#7a3cff;bottom:-30%;right:-20%;animation-delay:-5s}
.b3{background:#ff9a3d;top:30%;left:35%;width:45vmax;height:45vmax;opacity:.55;animation-delay:-9s}
.b4{background:#2fd3ff;top:-10%;right:-15%;width:40vmax;height:40vmax;opacity:.45;animation-delay:-3s}
@keyframes fl{to{transform:translate(12%,10%) scale(1.25) rotate(40deg)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
main{position:fixed;inset:0;display:grid;place-items:center;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);z-index:2}
.scr{display:none;width:100%;max-width:400px;text-align:center}
.scr.on{display:block;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(30px)}}
.glass{background:rgba(255,255,255,.14);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.4);border-radius:28px;padding:28px 22px;box-shadow:0 10px 60px rgba(255,61,139,.45),inset 0 0 30px rgba(255,255,255,.12)}
h1,h2{font-family:'Pacifico',cursive;font-weight:400;line-height:1.35;background:linear-gradient(90deg,#fff,#ffd1e8,#ffe9a8,#fff);background-size:250%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
h1{font-size:1.9rem}h2{font-size:1.7rem;margin:6px 0 10px}
@keyframes shine{to{background-position:250%}}
.sub{margin-top:8px;opacity:.9;font-size:.95rem}
.big{font-size:3.2rem;display:block;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) scale(1.1)}}
.dots{display:flex;gap:14px;justify-content:center;margin:20px 0}
.dots i{width:15px;height:15px;border-radius:50%;border:2px solid #fff;transition:.2s}
.dots i.f{background:#fff;box-shadow:0 0 14px #fff}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;justify-items:center}
.pad button{width:68px;height:68px;border-radius:50%;font-size:1.5rem;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.16);color:#fff;font-family:inherit;cursor:pointer;transition:.15s}
.pad button:active{background:#fff;color:#c2185b;transform:scale(.9)}
.pad .e{visibility:hidden}
.shake{animation:sh .45s}
@keyframes sh{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
#msg{min-height:1.4em;font-size:.9rem;color:#ffd1e8}
.row{display:flex;gap:16px;justify-content:center;align-items:center;margin-top:24px;min-height:70px}
.btn{font:600 1.1rem 'Poppins',sans-serif;border:none;border-radius:40px;padding:13px 34px;cursor:pointer;color:#fff;transition:transform .2s}
.yes{background:linear-gradient(135deg,#ff3d8b,#ff9a3d);box-shadow:0 0 30px rgba(255,61,139,.8);animation:beat 1.2s infinite}
@keyframes beat{50%{box-shadow:0 0 50px #ff3d8b}}
.no{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5)}
#story{position:relative;height:min(78vh,640px)}
#story .glass{height:100%;display:flex;flex-direction:column;justify-content:center;padding-top:44px}
.bars{position:absolute;top:14px;left:18px;right:18px;display:flex;gap:4px;z-index:3}
.bars b{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
.bars b i{display:block;height:100%;width:0;background:#fff}
.bars b.d i{width:100%}
.bars b.c i{animation:fill 11s linear forwards}
@keyframes fill{to{width:100%}}
#txt{font-size:1.02rem;line-height:1.75;min-height:11em;text-align:left;padding:0 4px}
.tap{position:absolute;top:0;bottom:0;width:40%;z-index:2}
.tl{left:0}.tr{right:0;width:60%}
.hint{position:absolute;bottom:12px;left:0;right:0;font-size:.75rem;opacity:.7}
@media(prefers-reduced-motion:reduce){.blob,h1,h2,.big,.yes{animation:none}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
<canvas id="fx"></canvas>
<main>

<section class="scr on" id="lock"><div class="glass" id="lk">
  <span class="big">🔒</span>
  <h1>Hey Udipapa</h1>
  <p class="sub">Enter the secret code to open your surprise</p>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <div id="msg" aria-live="polite"></div>
  <div class="pad" id="pad"></div>
</div></section>

<section class="scr" id="ask"><div class="glass">
  <span class="big">🎁</span>
  <h1 id="q">Can you want to see my surprise?</h1>
  <p class="sub" id="sub">Made only for you, Rojina</p>
  <div class="row"><button class="btn yes" id="yes">Yes 💖</button><button class="btn no" id="no">No</button></div>
</div></section>

<section class="scr" id="story">
  <div class="bars" id="bars"></div>
  <div class="tap tl" id="tl"></div><div class="tap tr" id="tr"></div>
  <div class="glass">
    <span class="big" id="em"></span>
    <h2 id="t"></h2>
    <p id="txt"></p>
    <div class="hint">tap right for next, left to go back</div>
  </div>
</section>

</main>
<script>
var $=function(i){return document.getElementById(i)};
function show(id){document.querySelectorAll('.scr').forEach(function(e){e.classList.remove('on')});$(id).classList.add('on')}

/* ---------- Effects canvas: stars, rising hearts, sparkle trail, confetti ---------- */
var cv=$('fx'),cx=cv.getContext('2d'),W,H,P=[],S=[];
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;S=[];for(var i=0;i<90;i++)S.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.4,p:Math.random()*6.3})}
addEventListener('resize',size);size();
var EM=['💖','✨','🌸','💗','⭐','💕','🦋'],COL=['#ff3d8b','#ffd1e8','#ffe9a8','#2fd3ff','#fff'];
function emoji(x,y,vx,vy,s,life,g){P.push({x:x,y:y,vx:vx,vy:vy,s:s,l:life,m:life,g:g||0,c:EM[Math.floor(Math.random()*EM.length)]})}
function burst(x,y,n){for(var i=0;i<n;i++){var a=Math.random()*6.28,v=3+Math.random()*7;
  if(i%3)P.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-3,s:7+Math.random()*6,l:90,m:90,g:.18,k:COL[i%5],r:Math.random()*6});
  else emoji(x,y,Math.cos(a)*v,Math.sin(a)*v-3,20+Math.random()*14,100,.12)}}
function rain(){for(var i=0;i<70;i++)setTimeout(function(){P.push({x:Math.random()*W,y:-20,vx:Math.random()*2-1,vy:2+Math.random()*3,s:6+Math.random()*6,l:300,m:300,g:.03,k:COL[Math.floor(Math.random()*5)],r:Math.random()*6})},i*25)}
setInterval(function(){emoji(Math.random()*W,H+20,Math.random()-.5,-1.2-Math.random(),14+Math.random()*18,Math.round(H/1.4),0)},450);
function trail(e){var t=e.touches?e.touches[0]:e;if(t)emoji(t.clientX,t.clientY,Math.random()*2-1,Math.random()*2-1,12+Math.random()*8,40,0)}
addEventListener('pointermove',trail);addEventListener('touchmove',trail,{passive:true});
addEventListener('pointerdown',function(e){burst(e.clientX,e.clientY,10)});
function loop(t){cx.clearRect(0,0,W,H);
  S.forEach(function(s){cx.globalAlpha=.4+.6*Math.abs(Math.sin(t/900+s.p));cx.fillStyle='#fff';cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.3);cx.fill()});
  P=P.filter(function(p){p.l--;p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;return p.l>0&&p.y<H+40});
  P.forEach(function(p){cx.globalAlpha=Math.min(1,p.l/(p.m*.4));
    if(p.c){cx.font=p.s+'px serif';cx.fillText(p.c,p.x,p.y)}
    else{cx.fillStyle=p.k;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r+=.15);cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()}});
  cx.globalAlpha=1;requestAnimationFrame(loop)}
requestAnimationFrame(loop);

/* ---------- Passcode (1234) ---------- */
var entry='';
['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(function(k){
  var b=document.createElement('button');b.textContent=k;if(!k)b.className='e';
  b.onclick=function(){key(k)};$('pad').appendChild(b)});
function paint(){var d=$('dots').children;for(var i=0;i<4;i++)d[i].className=i<entry.length?'f':''}
function key(k){
  if(k==='⌫')entry=entry.slice(0,-1);else if(entry.length<4)entry+=k;
  paint();
  if(entry.length===4){
    if(entry==='1234'){$('msg').textContent='Unlocked 💖';burst(innerWidth/2,innerHeight/2,50);setTimeout(function(){show('ask')},700)}
    else{$('msg').textContent='Wrong code. Think harder, Udipapa 😌';$('lk').classList.remove('shake');void $('lk').offsetWidth;$('lk').classList.add('shake');entry='';setTimeout(paint,350)}
  }
}
addEventListener('keydown',function(e){if($('lock').classList.contains('on')){if(/^\d$/.test(e.key))key(e.key);if(e.key==='Backspace')key('⌫')}});

/* ---------- Yes / runaway No ---------- */
var n=0,msgs=['What dare you! 😤','Nice try, Udipapa 😏','The No button is scared of you 😭','You cannot catch it 🏃‍♂️','Okay okay, just press Yes 🥺','Pleaseee? 💛'];
function dodge(e){
  e.preventDefault();var b=$('no');
  $('q').textContent=msgs[n%msgs.length];$('sub').textContent='';n++;
  b.style.position='fixed';b.style.zIndex=9;
  b.style.left=Math.random()*(innerWidth-110)+'px';b.style.top=Math.random()*(innerHeight-60)+'px';
  $('yes').style.transform='scale('+Math.min(1+n*.12,1.8)+')';
}
$('no').addEventListener('pointerenter',dodge);$('no').addEventListener('touchstart',dodge,{passive:false});$('no').onclick=dodge;
$('yes').onclick=function(e){burst(e.clientX,e.clientY,70);rain();setTimeout(function(){show('story');go(0)},900)};

/* ---------- Story letter ---------- */
var pages=[
['💌','Hello, Udipapa',"Rojina, my Udipapa. I made this little corner of the internet only for you. Please read slowly, and keep a smile ready. Everything here comes straight from my heart, with nothing hidden."],
['🌙','Where it began',"Do you remember how we started? Little talks, little laughs, and then suddenly you were the first person I wanted to tell everything to. I did not plan to fall for you. It just happened, quietly, and it became the best part of my days."],
['🦋','Why you are Udipapa',"You are my Udipapa, a name that is silly, soft and only ours. When I say it, I see your smile in my mind. No one else can make an ordinary word feel like home, but you do it every single time."],
['🌸','What I love about you',"I love how you care, how you laugh, and even how you get a little angry. I love the way you are completely yourself. Every small thing about you stayed with me, and I notice them all even now."],
['🌧️','The quiet months',"It has been almost three or four months since we stopped talking. Those months were so quiet, Rojina. I kept reaching for my phone to tell you about my day, and then I remembered. The silence taught me how much you matter."],
['⭐','What I understood',"In all that silence I understood one thing clearly. I only ever wanted you. There was never anyone else and there never will be. I cannot picture my life without you in it, and I do not want to try."],
['🤞','My promise',"If you give me a chance, I promise to listen more, to be more patient, and to never take you for granted again. I will fix what I broke and be the person you deserve. You never have to doubt my heart."],
['🕊️','One small wish',"I am not asking for everything at once. I only wish you would talk to me again, even a little. A simple hello would light up my whole world. I will wait for your answer, however long it takes."],
['💖','Always yours',"Thank you for reading this far, Rojina. Whatever you decide, you will always be special to me. But my heart will keep choosing you, again and again, my Udipapa. 💛"]
],cur=0,tm;
$('bars').innerHTML=pages.map(function(){return '<b><i></i></b>'}).join('');
function type(el,s){clearInterval(tm);el.textContent='';var i=0;tm=setInterval(function(){el.textContent=s.slice(0,++i);if(i>=s.length)clearInterval(tm)},24)}
function go(i){
  if(i<0)i=0;
  if(i>=pages.length){i=0;}
  cur=i;var bs=$('bars').children;
  for(var k=0;k<bs.length;k++){bs[k].className=k<i?'d':k===i?'c':'';var f=bs[k].firstChild;f.style.animation='none';void f.offsetWidth;f.style.animation=''}
  $('em').textContent=pages[i][0];$('t').textContent=pages[i][1];type($('txt'),pages[i][2]);
  if(i===pages.length-1){burst(innerWidth/2,innerHeight/3,60)}
  bs[i].firstChild.onanimationend=function(){if(cur<pages.length-1)go(cur+1)};
}
$('tr').onclick=function(){go(cur+1)};$('tl').onclick=function(){go(cur-1)};
</script>
</body>
</html>
